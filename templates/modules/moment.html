<div class="bbTimeList container" id="bbTimeList"
     th:if="${theme.config.top.moment}">

    <i class="haofont hao-icon-logo-moment" onclick="" style="font-size: 1.3rem;" title="瞬间"></i>

    <!--   未安装插件   -->
    <th:block th:if="!${pluginFinder.available('PluginMoments')}">
        <div class="swiper-container swiper-no-swiping" id="bbtalk" tabindex="-1">
            <div class="swiper-wrapper" id="bber-talk"
                 onclick="location.href=location.href='https\:\/\/github.com/halo-sigs/plugin-moments'">
                <div class="li-style swiper-slide">这里需要安装瞬间的插件</div>
                <div class="li-style swiper-slide">去安装吧！</div>
            </div>
        </div>
        <i class="bber-gotobb haofont hao-icon-circle-arrow-right"
           onclick="location.href=location.href='https\:\/\/github.com/halo-sigs/plugin-moments'" title="下载插件"></i>
    </th:block>

    <!--   瞬间插件   -->
    <th:block th:if="${pluginFinder.available('PluginMoments')}">
        <div class="swiper-container swiper-no-swiping" id="bbtalk" tabindex="-1">
            <div class="swiper-wrapper" id="bber-talk" onclick="pjax.loadUrl('/moments')" th:if="${momentFinder}">
                <th:block th:each="moment : ${momentFinder.listAll()}" th:with="content=${moment.spec.content}">
                    <div class="li-style swiper-slide"
                         th:if="${not #strings.isEmpty(content.raw)}"
                         th:utext="${content.raw}">
                    </div>
                </th:block>
            </div>
        </div>
        <i class="bber-gotobb haofont hao-icon-circle-arrow-right" onclick="location.href='/moments'" title="查看全文"></i>
    </th:block>
    <button th:if="${theme.config.top.climb.climbEnable}" class="climb home-pet" id="climb"
            type="button" title="摸摸我" aria-label="宠物挂件"
            onclick="halo.changeMarginLeft(this)">
        <span class="home-pet__tail"></span>
        <span class="home-pet__body">
            <span class="home-pet__ear home-pet__ear--left"></span>
            <span class="home-pet__ear home-pet__ear--right"></span>
            <span class="home-pet__face">
                <span class="home-pet__eye home-pet__eye--left"></span>
                <span class="home-pet__eye home-pet__eye--right"></span>
                <span class="home-pet__nose"></span>
                <span class="home-pet__whisker home-pet__whisker--left"></span>
                <span class="home-pet__whisker home-pet__whisker--right"></span>
            </span>
            <span class="home-pet__paw home-pet__paw--left"></span>
            <span class="home-pet__paw home-pet__paw--right"></span>
        </span>
    </button>

</div>
