<!-- 侧边栏自我介绍 -->

<div class="card-widget card-info" >

    <!-- 默认 -->
    <th:block th:if="${#strings.equals(theme.config.sidebar.profile.profileStyle, 'default')}">
        <div class="card-content profile-card-default"
             th:with="profileName=${#strings.isEmpty(theme.config.sidebar.profile.profileName) ? site.title : theme.config.sidebar.profile.profileName},
                      primaryButtonText=${#strings.isEmpty(theme.config.sidebar.profile.primaryButtonText) ? '关于我' : theme.config.sidebar.profile.primaryButtonText},
                      primaryButtonUrl=${#strings.isEmpty(theme.config.sidebar.profile.primaryButtonUrl) ? '/about' : theme.config.sidebar.profile.primaryButtonUrl},
                      secondaryButtonUrl=${#strings.isEmpty(theme.config.sidebar.profile.secondaryButtonUrl) ? '/about' : theme.config.sidebar.profile.secondaryButtonUrl}"
             th:style="|background-image: radial-gradient(circle at 50% 22%, rgba(255,255,255,.16), transparent 32%), linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.78)), url(${theme.config.sidebar.profile.backgroundImg});|">
            <div class="profile-card-default__body">
                <div class="author-info__sayhi" id="author-info__sayhi" onclick="heo.changeSayHelloText()"
                     th:title="${#strings.isEmpty(theme.config.sidebar.profile.helloText) ? '' : theme.config.sidebar.profile.helloText}">
                    你好啊！我是
                </div>
                <div class="author-info__name" th:text="${profileName}"></div>
                <div class="profile-card-default__identity"
                     th:if="${not #strings.isEmpty(theme.config.sidebar.profile.profileIdentity)}"
                     th:text="${theme.config.sidebar.profile.profileIdentity}"></div>
                <div class="author-info__description"
                     th:if="${not #strings.isEmpty(theme.config.sidebar.profile.profileDesc)}"
                     th:utext="${theme.config.sidebar.profile.profileDesc}"></div>
                <a class="profile-card-default__focus"
                   th:if="${not #strings.isEmpty(theme.config.sidebar.profile.currentFocusText) and not #strings.isEmpty(theme.config.sidebar.profile.currentFocusUrl)}"
                   th:href="${theme.config.sidebar.profile.currentFocusUrl}">
                    <span class="profile-card-default__focus-label">近期关注</span>
                    <span class="profile-card-default__focus-text" th:text="${theme.config.sidebar.profile.currentFocusText}"></span>
                </a>
                <div class="profile-card-default__focus"
                     th:if="${not #strings.isEmpty(theme.config.sidebar.profile.currentFocusText) and #strings.isEmpty(theme.config.sidebar.profile.currentFocusUrl)}">
                    <span class="profile-card-default__focus-label">近期关注</span>
                    <span class="profile-card-default__focus-text" th:text="${theme.config.sidebar.profile.currentFocusText}"></span>
                </div>
            </div>
            <div class="profile-card-default__footer">
                <div class="profile-card-default__actions">
                    <a class="profile-card-default__button profile-card-default__button--primary" th:href="${primaryButtonUrl}">
                        <span th:text="${primaryButtonText}"></span>
                    </a>
                    <a class="profile-card-default__button profile-card-default__button--secondary"
                       th:if="${not #strings.isEmpty(theme.config.sidebar.profile.secondaryButtonText)}"
                       th:href="${secondaryButtonUrl}">
                        <span th:text="${theme.config.sidebar.profile.secondaryButtonText}"></span>
                    </a>
                </div>
                <div class="card-info-social-icons is-center"
                     th:if="${not #lists.isEmpty(theme.config.sidebar.profile.socialMedia)}"
                     th:with="socialMedias = ${theme.config.sidebar.profile.socialMedia}">
                    <a class="social-icon" rel="external nofollow noopener" target="_blank"
                       th:each="socialMedia : ${socialMedias}"
                       th:if="${#strings.isEmpty(socialMedia.type) or #strings.equals(socialMedia.type, 'link')}"
                       th:href="${socialMedia.url}" th:title="${socialMedia.name}">
                        <i th:class="${socialMedia.icon}"></i>
                    </a>
                    <button class="social-icon profile-social-action"
                            type="button"
                            th:each="socialMedia : ${socialMedias}"
                            th:if="${#strings.equals(socialMedia.type, 'copy')}"
                            th:title="${socialMedia.name}"
                            th:attr="data-copy-text=${socialMedia.copyText},aria-label=${socialMedia.name}">
                        <i th:class="${socialMedia.icon}"></i>
                    </button>
                    <button class="social-icon profile-social-action"
                            type="button"
                            th:each="socialMedia : ${socialMedias}"
                            th:if="${#strings.equals(socialMedia.type, 'qrcode')}"
                            th:title="${socialMedia.name}"
                            th:attr="data-qrcode=${socialMedia.qrcode},data-qrcode-title=${socialMedia.name},aria-label=${socialMedia.name}">
                        <i th:class="${socialMedia.icon}"></i>
                    </button>
                </div>
            </div>
            <div class="profile-card-default__qrcode" hidden>
                <div class="profile-card-default__qrcode-panel">
                    <button class="profile-card-default__qrcode-close" type="button" aria-label="关闭">×</button>
                    <img class="profile-card-default__qrcode-img" alt="二维码">
                    <div class="profile-card-default__qrcode-title"></div>
                </div>
            </div>
        </div>

        <style>
            #aside-content .card-info #card-info-btn {
                display: none;
            }

            #aside-content .card-info .profile-card-default {
                position: relative;
                min-height: 322px;
                padding: 1.25rem;
                border: 1px solid rgba(255, 255, 255, .16);
                border-radius: 16px;
                background-size: cover;
                background-position: center;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                overflow: hidden;
                box-shadow: 0 18px 42px rgba(0, 0, 0, .20);
            }

            #aside-content .card-info .profile-card-default::before {
                position: absolute;
                inset: 0;
                content: '';
                pointer-events: none;
                background: linear-gradient(135deg, rgba(255, 255, 255, .14), transparent 34%, rgba(255, 255, 255, .06));
            }

            #aside-content .card-info .profile-card-default::after {
                position: absolute;
                right: 1rem;
                bottom: 1rem;
                width: 72px;
                height: 72px;
                content: '';
                border-right: 1px solid rgba(255, 255, 255, .28);
                border-bottom: 1px solid rgba(255, 255, 255, .18);
                border-radius: 0 0 14px 0;
                pointer-events: none;
            }

            #aside-content .card-info .profile-card-default__body {
                position: relative;
                z-index: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                color: var(--heo-white);
            }

            #aside-content .card-info .profile-card-default .author-info__sayhi {
                align-self: flex-start;
                display: inline-flex;
                align-items: center;
                max-width: 100%;
                min-height: 28px;
                padding: 0 12px;
                border-radius: 999px;
                background: var(--heo-white-op);
                color: var(--heo-white);
                font-size: 13px;
                line-height: 1.2;
                backdrop-filter: blur(8px);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #aside-content .card-info .profile-card-default .author-info__name {
                max-width: 100%;
                margin-top: 1.45rem;
                color: var(--heo-white);
                font-size: 28px;
                font-weight: 700;
                line-height: 1.15;
                overflow-wrap: anywhere;
            }

            #aside-content .card-info .profile-card-default__identity {
                max-width: 100%;
                margin-top: 0.42rem;
                padding: 5px 11px;
                border-radius: 999px;
                background: rgba(255, 255, 255, .14);
                color: rgba(255, 255, 255, .92);
                font-size: 12px;
                line-height: 1.2;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                backdrop-filter: blur(8px);
            }

            #aside-content .card-info .profile-card-default .author-info__description {
                max-width: 100%;
                margin-top: 0.78rem;
                color: rgba(255, 255, 255, .86);
                font-size: 14px;
                line-height: 1.55;
                display: -webkit-box;
                overflow: hidden;
                text-overflow: ellipsis;
                -webkit-line-clamp: 3;
                -webkit-box-orient: vertical;
            }

            #aside-content .card-info .profile-card-default__focus {
                width: 100%;
                margin-top: 0.9rem;
                padding: 10px 12px;
                display: flex;
                flex-direction: column;
                gap: 4px;
                border: 1px solid rgba(255, 255, 255, .13);
                border-radius: 12px;
                background: rgba(255, 255, 255, .10);
                color: var(--heo-white);
                text-align: left;
                text-decoration: none;
                backdrop-filter: blur(10px);
                transition: transform .2s ease, background .2s ease;
            }

            #aside-content .card-info a.profile-card-default__focus:hover {
                color: var(--heo-white);
                background: rgba(255, 255, 255, .16);
                transform: translateY(-1px);
            }

            #aside-content .card-info .profile-card-default__focus-label {
                color: rgba(255, 255, 255, .62);
                font-size: 11px;
                line-height: 1;
            }

            #aside-content .card-info .profile-card-default__focus-text {
                color: rgba(255, 255, 255, .94);
                font-size: 13px;
                line-height: 1.35;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            #aside-content .card-info .profile-card-default__footer {
                position: relative;
                z-index: 1;
                display: flex;
                align-items: center;
                flex-direction: column;
                gap: 10px;
                margin-top: 1.15rem;
            }

            #aside-content .card-info .profile-card-default__actions {
                width: 100%;
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 8px;
            }

            #aside-content .card-info .profile-card-default__button {
                min-width: 0;
                height: 38px;
                padding: 0 14px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                border-radius: 999px;
                font-size: 13px;
                font-weight: 600;
                line-height: 1;
                white-space: nowrap;
                text-decoration: none;
                transition: transform .2s ease, background .2s ease, color .2s ease;
            }

            #aside-content .card-info .profile-card-default__button:hover {
                transform: translateY(-1px);
            }

            #aside-content .card-info .profile-card-default__button--primary {
                background: var(--heo-white);
                color: var(--heo-main);
                box-shadow: 0 10px 24px rgba(0, 0, 0, .16);
            }

            #aside-content .card-info .profile-card-default__button--primary:hover {
                color: var(--heo-main);
            }

            #aside-content .card-info .profile-card-default__button--secondary {
                border: 1px solid rgba(255, 255, 255, .22);
                background: rgba(255, 255, 255, .10);
                color: var(--heo-white);
            }

            #aside-content .card-info .profile-card-default__button--secondary:hover {
                color: var(--heo-white);
                background: rgba(255, 255, 255, .16);
            }

            #aside-content .card-info .profile-card-default .card-info-social-icons {
                width: 100%;
                margin: 0;
                display: flex;
                justify-content: flex-start;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 8px;
            }

            #aside-content .card-info .profile-card-default .card-info-social-icons .social-icon {
                margin: 0;
                padding: 0;
                border: 0;
                background: transparent;
                cursor: pointer;
            }

            #aside-content .card-info .profile-card-default .card-info-social-icons i {
                width: 34px;
                height: 34px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                background: var(--heo-white-op);
                color: var(--heo-white);
                font-size: 1.05rem;
                transition: transform .2s ease, background .2s ease;
            }

            #aside-content .card-info .profile-card-default .card-info-social-icons .social-icon:hover i {
                background: rgba(255, 255, 255, .18);
                color: var(--heo-white);
                transform: translateY(-2px) scale(1.06);
                box-shadow: none;
            }

            #aside-content .card-info .profile-card-default__qrcode {
                position: absolute;
                inset: 0;
                z-index: 4;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
                background: rgba(0, 0, 0, .42);
                backdrop-filter: blur(10px);
            }

            #aside-content .card-info .profile-card-default__qrcode[hidden] {
                display: none;
            }

            #aside-content .card-info .profile-card-default__qrcode-panel {
                position: relative;
                width: min(190px, 100%);
                padding: 16px 14px 14px;
                border-radius: 14px;
                background: var(--heo-white);
                box-shadow: 0 20px 48px rgba(0, 0, 0, .26);
                text-align: center;
            }

            #aside-content .card-info .profile-card-default__qrcode-close {
                position: absolute;
                top: 6px;
                right: 8px;
                width: 24px;
                height: 24px;
                padding: 0;
                border: 0;
                border-radius: 50%;
                background: transparent;
                color: var(--heo-fontcolor);
                cursor: pointer;
                line-height: 24px;
            }

            #aside-content .card-info .profile-card-default__qrcode-img {
                width: 132px;
                height: 132px;
                margin-top: 8px;
                object-fit: cover;
                border-radius: 8px;
            }

            #aside-content .card-info .profile-card-default__qrcode-title {
                margin-top: 8px;
                color: var(--heo-fontcolor);
                font-size: 13px;
                line-height: 1.3;
            }

            @media screen and (max-width: 768px) {
                #aside-content .card-info .profile-card-default {
                    min-height: 308px;
                }

                #aside-content .card-info .profile-card-default__actions {
                    grid-template-columns: 1fr;
                }
            }
        </style>

    </th:block>


    <!-- 样式一 -->
    <th:block th:if="${#strings.equals(theme.config.sidebar.profile.profileStyle, 'one')}">


        <div class="card-content">
            <div class="card-info-avatar is-center">
                <div class="author-info__top-group">
                    <div class="author-info__sayhi" id="author-info__sayhi" onclick="heo.changeSayHelloText()">你好啊！
                    </div>
                </div>
            </div>
            <div class="avatar-img-group">
                <img class="avatar-img" alt="avatar"
                     th:with="img = @{${#strings.isEmpty(site.logo) ? assets_link + '/images/hao-logo.jpg' : site.logo}}"

                     th:src="${isLazyload ? '' : img}"
                     th:data-lazy-src="${ isLazyload ? img : ''}">
                <div class="avatar-sticker">
                    <img class="avatar-sticker-img" alt="avatar"
                         th:with="img = @{${theme.config.sidebar.profile.stickerImg}}"

                         th:src="${isLazyload ? '' : img}"
                         th:data-lazy-src="${ isLazyload ? img : ''}">
                </div>
            </div>
            <div class="author-info__description_group" th:utext="${theme.config.sidebar.profile.profileDesc}">
            </div>
            <div class="author-info__bottom-group">
                <a th:if="${not #strings.isEmpty(theme.config.sidebar.profile.profileName)}"
                   class="author-info__bottom-group-left" href="/about" data-pjax-state="">
                    <div class="author-info__name">[[${theme.config.sidebar.profile.profileName}]]</div>
                    <div class="author-info__desc">[[${theme.config.sidebar.profile.desc}]]</div>
                </a>
                <div class="card-info-social-icons is-center"
                     th:if="${not #lists.isEmpty(theme.config.sidebar.profile.socialMedia)}"
                     th:with="socialMedias = ${theme.config.sidebar.profile.socialMedia}">
                    <a class="social-icon" rel="external nofollow" target="_blank"
                       th:each="socialMedia : ${socialMedias}" th:href="${socialMedia.url}"
                       th:title="${socialMedia.name}">
                        <i th:class="${socialMedia.icon}"></i>
                    </a>
                </div>
            </div>
        </div>



        <style>
            .card-info-avatar.is-center {
                flex-direction: column;
                display: flex;
                align-items: flex-start
            }

            #aside-content .card-info img.avatar-img {
                width: 118px;
                right: 0;
                top: 0;
                border-radius: 500px;
                position: absolute;
                opacity: 1;
                transition: .3s;
                border: 5px solid var(--heo-white);
                overflow: hidden
            }

            .page #aside-content .card-info img.avatar-img {
                border-color: var(--heo-card-bg)
            }

            .author-info__top-group {
                display: flex;
                height: 28px;
                width: 100%
            }

            .author-info__desc {
                font-size: 12px;
                color: var(--heo-white);
                opacity: .6;
                line-height: 1
            }

            .avatar-img-group {
                width: 118px;
                height: 118px;
                right: calc(50% - 59px);
                top: 90px;
                border-radius: 500px;
                position: absolute;
                transition: cubic-bezier(.69, .39, 0, 1.21) .3s;
                transform-origin: bottom
            }

            #aside-content .card-info:hover .avatar-img-group {
                opacity: 0;
                transform: scale(0)
            }

            .author-info__bottom-group {
                display: flex;
                justify-content: space-between;
                position: absolute;
                padding: 1.2rem;
                width: 100%;
                left: 0;
                bottom: 0;
                align-items: center
            }

            a.author-info__bottom-group-left:hover {
                opacity: .8
            }

            #aside-content .card-info .card-info-social-icons {
                margin: 0;
                display: flex;
                justify-content: flex-start;
                flex-direction: row;
                flex-wrap: wrap;
                cursor: pointer
            }


            #aside-content .card-info .card-info-social-icons i:hover {
                transform: rotate(540deg);
                background-color: #000;
                cursor: pointer
            }

            #aside-content .card-info .card-info-social-icons .social-icon {
                margin: 0;
                margin-left: 8px
            }

            #aside-content .card-info .card-info-social-icons i {
                background: var(--heo-white-op);
                color: var(--heo-white);
                font-size: 1rem;
                width: 40px;
                height: 40px;
                display: flex;
                align-items: center;
                justify-content: center
            }

            #aside-content .card-info .card-info-social-icons i:hover {
                background: var(--heo-white);
                transform: scale(1.1);
                color: var(--heo-main);
                box-shadow: none
            }

            [data-theme=dark] .page #aside-content .card-info .card-info-social-icons i {
                background: var(--heo-black-op);
                color: var(--heo-card-bg)
            }

            [data-theme=dark] .page #aside-content .card-info .card-info-social-icons i:hover {
                background: var(--heo-card-bg);
                color: var(--heo-fontcolor)
            }

            #aside-content .card-info .banner-button {
                height: 40px;
                width: 118px;
                border-radius: 20px;
                justify-content: center
            }

            @media screen and (min-width: 1300px) {
                #aside-content .card-info .card-info-social-icons i {
                    color: var(--heo-white)
                }

                [data-theme=dark] .page #aside-content .card-info .card-info-social-icons i {
                    color: var(--heo-card-bg)
                }
            }

            #aside-content .card-info .card-info-data>.card-info-data-item:hover {
                background: var(--heo-post-blockquote-bg);
                transform: scale(.97)
            }

            #aside-content>div.card-widget.card-info>div.card-content>div.card-info-data>.card-info-data-item:hover>a>div.headline,#aside-content>div.card-widget.card-info>div.card-content>div.card-info-data>.card-info-data-item:hover>a>div.length-num {
                color: var(--heo-blue)
            }

            .author-info__description_group {
                position: absolute;
                top: 50px;
                width: 100%;
                left: 0;
                padding: 1.2rem;
                opacity: 0;
                transition: .3s
            }

            .card-widget:hover .author-info__description_group {
                opacity: 1
            }

            .author-info__description2 {
                line-height: 1.38;
                margin: .3rem 0;
                text-align: justify;
                width: 100%;
                z-index: 2;
                color: rgba(255, 255, 255, .8)
            }

            .author-info__description2 b {
                color: var(--heo-white)
            }

            div#author-info__sayhi {
                text-align: center;
                width: fit-content;
                color: var(--heo-white);
                background: var(--heo-white-op);
                font-size: 12px;
                margin-right: auto;
                padding: 2px 8px;
                border-radius: 12px;
                cursor: pointer;
                -webkit-user-select: none;
                transition: .3s;
                margin: auto;
                min-width: 100px
            }

            div#author-info__sayhi:hover {
                background: var(--heo-white);
                color: var(--heo-main);
                transform: scale(1.1)
            }

            [data-theme=dark] .page div#author-info__sayhi {
                background: var(--heo-black-op);
                color: var(--heo-black)
            }

            #aside-content .card-info .author-info__name {
                text-align: left;
                font-weight: 700;
                color: var(--heo-white);
                font-size: 20px;
                line-height: 1;
                margin-bottom: 5px
            }

            .page #aside-content .card-info .author-info__name,.page .author-info__desc {
                color: var(--heo-card-bg)
            }

            .author-info__desc {
                font-size: 12px;
                color: var(--heo-white);
                opacity: .6;
                line-height: 1
            }

            .author-info__description {
                line-height: 1.38;
                margin: .3rem 0;
                text-align: justify;
                color: var(--heo-white);
                opacity: 1
            }

            .page .author-info__description {
                color: var(--heo-card-bg)
            }

            .author-info__description b {
                color: var(--heo-white);
                opacity: 1
            }

            .page .author-info__description b {
                color: var(--heo-card-bg);
                opacity: 1
            }

            .avatar-sticker {
                position: absolute;
                bottom: 2px;
                right: 2px;
                width: 33px;
                height: 33px;
                line-height: 34px;
                z-index: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: .3s ease-out .2s;
                transform: scale(1);
                background: var(--heo-white);
                border-radius: 50%
            }

            .page .avatar-sticker {
                background: var(--heo-card-bg)
            }

            .avatar-sticker img {
                width: 26px;
                height: 26px
            }

            .card-widget:hover .avatar-sticker {
                opacity: 0;
                transform: scale(0)
            }

            .author-info__description b {
                color: var(--heo-white);
            }

            #aside-content>.card-widget.card-info::before {
                background: linear-gradient(-25deg, var(--heo-main), var(--heo-main-op-deep), var(--heo-main), var(--heo-main-op-deep));
                background-size: 400%;
                position: absolute;
                width: 100%;
                height: 100%;
                left: 0;
                top: 0;
                content: '';
                animation: gradient 15s ease infinite;
            }
        </style>


    </th:block>

</div>
