<!-- 页脚模块（简洁版） -->
<footer id="footer" xmlns:th="http://www.thymeleaf.org">

    <div class="fclean">
        <!-- 主体：左品牌 + 右链接列 -->
        <div class="fclean__main">

            <!-- 左侧：站名 + slogan + 社交 -->
            <div class="fclean__brand">
                <a class="fclean__name" href="/" data-pjax-state="" th:text="${site.title}">BeorDie</a>
                <p class="fclean__slogan" th:if="${not #strings.isEmpty(site.subtitle)}" th:text="${site.subtitle}"></p>

                <div class="fclean__socials">
                    <th:block th:with="socialMedias = ${theme.config.footer.social_media.socialMediaLeft}">
                        <a th:each="socialMedia : ${socialMedias}"
                           th:href="${socialMedia.url}" th:title="${socialMedia.name}"
                           rel="noopener external nofollow" target="_blank">
                            <i th:if="${socialMedia.option_social_data == 'icon' || #strings.isEmpty(socialMedia.option_social_data)}"
                               th:class="${socialMedia.icon}"></i>
                            <th:block th:if="${socialMedia.option_social_data == 'custom'}" th:utext="${socialMedia.icon}"></th:block>
                        </a>
                    </th:block>
                    <th:block th:with="socialMedias = ${theme.config.footer.social_media.socialMediaRight}">
                        <a th:each="socialMedia : ${socialMedias}"
                           th:href="${socialMedia.url}" th:title="${socialMedia.name}"
                           rel="noopener external nofollow" target="_blank">
                            <i th:if="${socialMedia.option_social_data == 'icon' || #strings.isEmpty(socialMedia.option_social_data)}"
                               th:class="${socialMedia.icon}"></i>
                            <th:block th:if="${socialMedia.option_social_data == 'custom'}" th:utext="${socialMedia.icon}"></th:block>
                        </a>
                    </th:block>
                </div>
            </div>

            <!-- 右侧：链接列（来自页脚菜单） -->
            <div class="fclean__cols"
                 th:if="${not #strings.isEmpty(theme.config.footer.menu)}"
                 th:with="footMenu = ${menuFinder.getByName(theme.config.footer.menu)}">

                <div class="fclean__col" th:each="menuItem : ${footMenu.menuItems}">
                    <h4 class="fclean__col-title" th:text="${menuItem.status.displayName}"></h4>
                    <a class="fclean__link" th:each="childMenu : ${menuItem.children}"
                       th:href="@{${childMenu.status.href}}"
                       th:target="${childMenu.spec.target?.value}"
                       th:text="${childMenu.status.displayName}"></a>
                </div>

                <!-- 友链列 -->
                <div class="fclean__col" th:if="${theme.config.footer.footer_group.enable_footer_group}">
                    <div class="fclean__col-head">
                        <h4 class="fclean__col-title">友链</h4>
                        <button class="fclean__refresh" id="footer-random-friends-btn"
                                onclick="heo.addFriendLinksInFooter()" title="换一批">
                            <i class="haofont hao-icon-arrow-rotate-right"></i>
                        </button>
                    </div>
                    <div id="friend-links-in-footer"></div>
                </div>
            </div>
        </div>

        <!-- 底条 -->
        <div class="fclean__bar">
            <div class="fclean__bar-left">
                <!-- 版权 -->
                <span class="fclean__copy"
                      th:if="${not #strings.isEmpty(theme.config.basics.siteStartTime)}">
                    ©<span th:text="${#strings.arraySplit(theme.config.basics.siteStartTime, '-')[0]}"></span>–<span th:text="${#dates.format(new java.util.Date(), 'yyyy')}"></span>
                </span>
                <span class="fclean__copy" th:if="${#strings.isEmpty(theme.config.basics.siteStartTime)}">
                    ©<span th:text="${#dates.format(new java.util.Date(), 'yyyy')}"></span>
                </span>

                <span class="fclean__sep" th:if="${not #strings.isEmpty(theme.config.basics.siteStartTime) || not #strings.isEmpty(theme.config.basics.icp)}">·</span>

                <!-- ICP -->
                <a th:if="${not #strings.isEmpty(theme.config.basics.icp)}"
                   href="https://beian.miit.gov.cn/#/Integrated/index"
                   rel="noopener external nofollow" target="_blank">
                    <span th:if="${not #strings.startsWith(theme.config.basics.icp, 'http')}"
                          th:text="${theme.config.basics.icp}"></span>
                    <img th:if="${#strings.startsWith(theme.config.basics.icp, 'http')}"
                         th:src="@{${theme.config.basics.icp}}" alt="icp"/>
                </a>

                <span class="fclean__sep" th:if="${not #strings.isEmpty(theme.config.basics.icp) && not #strings.isEmpty(theme.config.basics.gongan)}">·</span>

                <!-- 公安备案 -->
                <a th:if="${not #strings.isEmpty(theme.config.basics.gongan)}"
                   href="http://www.beian.gov.cn/portal/registerSystemInfo"
                   rel="noopener external nofollow" target="_blank">
                    <span th:if="${not #strings.startsWith(theme.config.basics.gongan, 'http')}"
                          th:text="${theme.config.basics.gongan}"></span>
                    <img th:if="${#strings.startsWith(theme.config.basics.gongan, 'http')}"
                         th:src="@{${theme.config.basics.gongan}}" alt="gongan"/>
                </a>

                <span class="fclean__sep">·</span>

                <!-- Powered by -->
                <span class="fclean__powered">
                    Powered by <a href="https://halo.run" rel="noopener external nofollow" target="_blank">Halo</a>
                    / <a href="https://github.com/liuzhihang/halo-theme-hao" rel="noopener external nofollow" target="_blank">HEO</a>
                </span>

                <span class="fclean__sep" th:if="${theme.config.footer.footerContent.default_enable_group.about || theme.config.footer.footerContent.default_enable_group.dingyue || theme.config.footer.footerContent.default_enable_group.zhuti}">·</span>

                <!-- 关于 -->
                <a th:if="${theme.config.footer.footerContent.default_enable_group.about}" class="fclean__link" href="/about" data-pjax-state="">关于</a>
                <!-- 订阅 -->
                <a th:if="${pluginFinder.available('PluginFeed') and theme.config.footer.footerContent.default_enable_group.dingyue}" class="fclean__link" href="/rss.xml">订阅</a>
                <!-- 主题 -->
                <a th:if="${theme.config.footer.footerContent.default_enable_group.zhuti}" class="fclean__link" href="https://github.com/liuzhihang/halo-theme-hao" rel="noopener external nofollow" target="_blank">主题</a>
            </div>

            <!-- 回顶 -->
            <button class="fclean__top" onclick="btf.scrollToDest(0, 500)" title="返回顶部">
                <i class="haofont hao-icon-arrow-up"></i>
            </button>
        </div>
    </div>

    <!-- Halo 注入 -->
    <halo:footer />

    <!-- 右下角 snackbar 弹窗 -->
    <div th:if="${theme.config.tool.snackbar.switch}" class="needEndHide" id="cookies-window">
        <div class="cookies-window-title" th:text="${theme.config.tool.snackbar.introductionTitle}"></div>
        <div class="cookies-window-content"><span class="cookies-tip"
                                                  th:text="${theme.config.tool.snackbar.introductionTip}"></span>
            <a class="cookies-link" th:href="@{${theme.config.tool.snackbar.introductionUrl}}"
               th:title="${theme.config.tool.snackbar.introductionName}" data-pjax-state=""><i
                    class="bber-gotobb haofont hao-icon-circle-arrow-right"></i></a>
        </div>
    </div>
    <div id="quit-box" onclick="RemoveRewardMask()"></div>

    <!--评论弹幕弹窗 -->
    <div class="comment-barrage needEndHide" style="display: none;"></div>

    <th:block th:if="${theme.config.top.global_background.enable_global_background_img}">
        <style>
            @media screen and (min-width: 1300px) {
                #footer {
                    background: linear-gradient(180deg, var(--heo-card-bg-none) 0%, #fff0 25%);
                    margin-top: 0.5rem;
                    display: flex;
                    flex-direction: column;
                }
            }

            @media screen and (max-width: 1300px) {
                #footer {
                    background: linear-gradient(180deg, var(--heo-background) 0%, #fff0 25%);
                    margin-top: 0;
                    z-index: 3;
                }
            }
        </style>
    </th:block>

</footer>
