<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layouts/layout :: layout(content = ~{::content}, htmlType = 'index', title = null, head = ~{::head})}">
<th:block th:fragment="head">
    <th:block th:replace="~{modules/common/open-graph :: open-graph(_title = ${site.title},
                _permalink = '',
                _cover = ${theme.config.other.opengraph.image},
                _excerpt = ${site.seo.description},
                _type = 'website')}"></th:block>
</th:block>
<th:block th:fragment="content">
    
    <div class="page" id="body-wrap">
        <!-- 头部导航栏 -->
        <header th:class="${theme.config.top.above.enable_above ? 'full_page' : 'not-top-img'}" id="page-header">
            <nav th:replace="~{modules/nav :: nav(title = ${siteTitle})}"></nav>
            <!-- 问候语 -->
            <th:block th:replace="~{modules/header/greeting}"/>
            <!-- 第一屏 -->
            <th:block th:replace="~{modules/header/index-img}"/>
        </header>
        <!-- 代码雨背景 -->
        <canvas id="code-rain"></canvas>
        
        <!-- 页面主体内容 -->
        <div class="page">
            <div id="home_top">
                <!-- 每日说说 -->
                <div th:replace="~{modules/moment}"/>
                <!-- 置顶内容 -->
                <div th:replace="~{modules/recent-top}"/>
            </div>
            <main class="layout" id="content-inner" th:classappend="${theme.config.sidebar.location}">
                <div class="recent-posts" id="recent-posts">
                    
                    <!-- 分类导航栏 -->
                    <div th:replace="~{'modules/bar/' + ${theme.config.layout.navs.nav}}"></div>
                    
                    <th:block th:replace="~{modules/post-list}"/>
                
                </div>
                <div th:replace="~{modules/aside :: aside(${theme.config.sidebar.widgetss.indexWidget})}"></div>
            </main>
        </div>
        <!-- 底部 -->
        <footer th:replace="~{modules/footer}"/>
    </div>

    <!-- 代码雨核心功能 -->
    <script>
        // 代码雨核心功能
        (function() {
            // 获取画布元素
            const canvas = document.getElementById('code-rain');
            const ctx = canvas.getContext('2d');
            
            // 设置画布尺寸并监听窗口大小变化
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 代码雨字符集（可自定义）
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヰヱヲンガギグゲゴザジズゼゾダヂヅデドバビブベボパピプペポABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const fontSize = 14; // 字符大小
            let columns = canvas.width / fontSize; // 列数
            
            // 存储每列字符的Y轴位置
            let drops = [];
            function initDrops() {
                drops = [];
                columns = canvas.width / fontSize;
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.random() * -100; // 初始位置随机，避免同时开始
                }
            }
            initDrops();
            window.addEventListener('resize', initDrops);

            // 绘制代码雨的核心函数
            function drawCodeRain() {
                // 半透明背景层，实现拖影效果（关键）
                ctx.fillStyle = 'rgba(10, 10, 26, 0.05)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 设置字符样式
                ctx.fillStyle = '#00ff9c'; // 字符颜色（青绿色）
                ctx.font = `${fontSize}px Consolas, 'Courier New', monospace`;
                
                // 逐列绘制字符
                for (let i = 0; i < drops.length; i++) {
                    // 随机选择字符
                    const text = chars[Math.floor(Math.random() * chars.length)];
                    // 绘制字符
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    
                    // 当字符超出画布底部，随机重置位置
                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    
                    // 让字符向下移动
                    drops[i]++;
                }
            }

            // 启动动画（35ms刷新一次，可调整速度）
            setInterval(drawCodeRain, 35);
        })();
    </script>
</th:block>

</html>
